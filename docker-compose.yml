services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_ai}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the private .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./services/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://db}
      PGUSER: ${APP_DB_USER:?Run the management prepare command first}
      PGPASSWORD: ${APP_DB_PASSWORD:?Run the management prepare command first}
      PGDATABASE: ${POSTGRES_DB:-restaurant_ai}
      APP_ENV: ${APP_ENV:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DEMO_MODE: ${DEMO_MODE:-true}
      EDGE_SYNC_ENABLED: ${EDGE_SYNC_ENABLED:-false}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: ./apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
