[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-ai-edge-agent"
version = "0.1.0"
description = "Restaurant AI Monitoring edge-agent foundation"
requires-python = ">=3.11"
dependencies = [
  "opencv-python-headless==4.13.0.92",
  "numpy>=2,<3",
  "keyring==25.7.0; sys_platform == 'win32'",
  "fastapi>=0.162,<0.163",
  "uvicorn>=0.54,<0.55",
  "httpx>=0.28,<0.29",
  "pydantic>=2.14,<3",
]

[project.scripts]
restaurant-edge = "restaurant_edge.cli:main"

[project.optional-dependencies]
ai = [
  "onnxruntime==1.31.1",
  "protobuf==7.36.2",
  "flatbuffers==25.12.19",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
restaurant_edge = ["static/*.html", "static/*.js", "static/*.css"]

[tool.setuptools.data-files]
"share/restaurant-ai-edge-agent/licenses" = ["third_party/RFDETR_LICENSE.txt", "third_party/RFDETR.md"]
